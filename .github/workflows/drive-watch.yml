name: Drive Watch

on:
  schedule:
    - cron: '*/10 * * * *'  # public repo → standard-runner minutes are free
  workflow_dispatch:

concurrency:
  group: drive-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Check Drive for changes
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          FOLDER_IDS: ${{ vars.FOLDER_IDS }}
          TARGET_REPO: ${{ vars.TARGET_REPO }}
          WORKFLOW_FILE: ${{ vars.WORKFLOW_FILE }}
        run: python watch.py

      - name: Persist fingerprint / monthly keepalive
        run: |
          # Scheduled workflows on public repos are auto-disabled after 60 days
          # without repo activity — a monthly heartbeat commit prevents that.
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m > state/heartbeat.txt
          fi
          git config user.name "drive-watch[bot]"
          git config user.email "drive-watch@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update watch state"
            git push
          fi
